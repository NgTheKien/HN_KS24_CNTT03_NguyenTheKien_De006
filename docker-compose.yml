# =============================================================================
#  docker-compose.yml - FILE KHUNG
#  - Service "mysql", networks, volumes: ĐÃ CẤU HÌNH SẴN, không cần sửa.
#  - Hệ thống chỉ gồm backend Spring Boot (trả JSON), Nginx làm reverse proxy, MySQL.
#  - Mạng: proxy-net (nginx <-> app), db-net (app <-> mysql); MySQL KHÔNG publish cổng.
#  - Sinh viên điền các ô ______ tại các dòng TODO trong service "app" và "nginx".
#  - Chạy:  docker compose --env-file student.env up -d --build
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:?Chua dien COMPOSE_PROJECT_NAME trong student.env}

services:
  # ---------------------------------------------------------------- MySQL (CÓ SẴN)
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - db-net

  # ---------------------------------------------------------------- Spring Boot
  app:
    build:
      context: ./${APP_DIR:-backend}
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
        GRADLE_VERSION: ${GRADLE_VERSION:-8.14.3}
    image: ${APP_IMAGE:-app-backend:local}
    container_name: app-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  # ---------------------------------------------------------------- Nginx (reverse proxy)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # TODO 4: publish cổng cá nhân APP_PORT (trong student.env) ra cổng 80 của container
    ports:
      - "127.0.0.1:8080:8080"
    # TODO 5: mount (read-only)  nginx/default.conf -> /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - proxy-net

networks:
  proxy-net:
  db-net:

volumes:
  mysql_data:
